<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - The2008 Printhouse</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cart-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            color: #fff;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #444;
            padding-bottom: 1rem;
        }
        .cart-header h1 {
            color: #fff;
            font-size: 2rem;
        }
        .back-link {
            display: inline-block;
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .cart-items {
            margin-bottom: 2rem;
        }
        .cart-item {
            background: #2a2a2a;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            display: grid;
            grid-template-columns: 100px 1fr 150px;
            gap: 1.5rem;
            align-items: center;
        }
        .cart-item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
        }
        .cart-item-details h3 {
            color: #fff;
            margin-bottom: 0.5rem;
        }
        .cart-item-details p {
            color: #b0b0b0;
            font-size: 0.9rem;
            margin: 0.3rem 0;
        }
        .cart-item-actions {
            text-align: right;
        }
        .cart-item-price {
            font-size: 1.3rem;
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .remove-btn:hover {
            background: #c82333;
        }
        .empty-cart {
            text-align: center;
            padding: 3rem;
            color: #b0b0b0;
            font-size: 1.1rem;
        }
        .cart-summary {
            background: #2a2a2a;
            padding: 2rem;
            border-radius: 5px;
            margin-bottom: 2rem;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        .summary-row.total {
            border-top: 2px solid #444;
            padding-top: 1rem;
            font-size: 1.3rem;
            color: #00ff00;
            font-weight: bold;
        }
        .cart-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-continue {
            background: #007bff;
            color: white;
        }
        .btn-continue:hover {
            background: #0056b3;
        }
        .btn-checkout {
            background: #28a745;
            color: white;
        }
        .btn-checkout:hover {
            background: #1e7e34;
        }
        @media (max-width: 768px) {
            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 1rem;
            }
            .cart-item-actions {
                grid-column: 1 / -1;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <div class="cart-header">
            <h1>🛒 Shopping Cart</h1>
            <a href="index.html#order" class="back-link">← Back to Shop</a>
        </div>
        
        <div id="cartContent">
            <!-- Cart items will be loaded here -->
        </div>

        <div id="emptyCart" class="empty-cart" style="display: none;">
            <p>Your cart is empty 😢</p>
            <p style="margin-top: 1rem;"><a href="index.html#order" style="color: #007bff;">Continue shopping →</a></p>
        </div>

        <div id="cartSummary" style="display: none;">
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₱ 0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping:</span>
                    <span id="shipping">FREE</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">₱ 0.00</span>
                </div>
            </div>

            <div class="cart-actions">
                <a href="index.html#order" class="btn btn-continue">← Continue Shopping</a>
                <button class="btn btn-checkout" onclick="checkout()">💳 Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script>
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartContent = document.getElementById('cartContent');
            const emptyCart = document.getElementById('emptyCart');
            const cartSummary = document.getElementById('cartSummary');

            if (cart.length === 0) {
                cartContent.style.display = 'none';
                emptyCart.style.display = 'block';
                cartSummary.style.display = 'none';
                return;
            }

            cartContent.innerHTML = '<div class="cart-items">';
            let subtotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                cartContent.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                        <div class="cart-item-details">
                            <h3>${item.name}</h3>
                            <p><strong>Size:</strong> ${item.size}</p>
                            <p><strong>Color:</strong> ${item.color}</p>
                            <p><strong>Qty:</strong> ${item.quantity}</p>
                        </div>
                        <div class="cart-item-actions">
                            <div class="cart-item-price">₱ ${(item.price * item.quantity).toFixed(2)}</div>
                            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });

            cartContent.innerHTML += '</div>';
            
            document.getElementById('subtotal').textContent = '₱ ' + subtotal.toFixed(2);
            document.getElementById('total').textContent = '₱ ' + subtotal.toFixed(2);

            emptyCart.style.display = 'none';
            cartContent.style.display = 'block';
            cartSummary.style.display = 'block';
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function checkout() {
            window.location.href = 'index.html#contact';
        }

        loadCart();
    </script>
</body>
</html>
